<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="세 개의 원으로 표현한 좌우 왕복 움직임">
<title>Shark Motion</title>
<style>
:root { --period: 2.4s; --size: 80px; --gap: 24px; --ink: #708090; --paper: #64b2d4; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
body { overflow: hidden; }
main { height: 100svh; min-height: 320px; display: grid; place-items: center; }
.motion { display: flex; flex-direction: column; gap: var(--gap); }
.circle { width: var(--size); height: var(--size); border-radius: 50%; background: var(--ink); transform-origin: center; will-change: transform; animation: sway var(--period) infinite; }
.circle:nth-child(1) { --range: 24px; animation-delay: -2.4s; }
.circle:nth-child(2) { --range: 48px; animation-delay: -2.28s; }
.circle:nth-child(3) { --range: 72px; animation-delay: -2.16s; }
/* Quarter-cycle curves approximate sine motion: fast at center, slow at each end. */
@keyframes sway {
  0% { transform: translateX(0); animation-timing-function: cubic-bezier(.33,.52,.67,1); }
  25% { transform: translateX(var(--range)); animation-timing-function: cubic-bezier(.33,0,.67,.48); }
  50% { transform: translateX(0); animation-timing-function: cubic-bezier(.33,.52,.67,1); }
  75% { transform: translateX(calc(-1 * var(--range))); animation-timing-function: cubic-bezier(.33,0,.67,.48); }
  100% { transform: translateX(0); }
}
body.paused .circle { animation-play-state: paused; }
</style>
</head>
<body>
<main aria-label="상어 꼬리지느러미의 움직임을 추상화한 애니메이션. 같은 크기의 원 세 개가 세로로 배치되어 부드럽게 좌우로 흔들립니다.">
  <div class="motion" role="img" aria-label="2.4초 주기로 반복하는 회색 원 세 개">
    <div class="circle"></div><div class="circle"></div><div class="circle"></div>
  </div>
</main>
<script>
// Playback starts automatically; Space provides an optional keyboard pause.
document.addEventListener('keydown', event => {
  if (event.code === 'Space') { event.preventDefault(); document.body.classList.toggle('paused'); }
});
</script>
</body>
</html>
